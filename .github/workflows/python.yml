# Lints and tests the Python: catalog tooling plus the engineering templates.
#
# The template smoke tests are the part that matters scientifically. They check
# analytical identities (V_CSTR/V_PFR = 1/(1-X)), conservation laws, and unit
# round trips — not recorded outputs — so they can catch a template that was
# never right, which a regression baseline cannot.
name: Python

on:
  push:
    branches: [main]
    paths: ["templates/**", "scripts/**", "tests/**", "requirements-dev.txt", ".github/workflows/python.yml"]
  pull_request:
    paths: ["templates/**", "scripts/**", "tests/**", "requirements-dev.txt", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ipykernel
          python -m ipykernel install --user --name python3

      - name: Lint
        run: ruff check scripts tests templates
        continue-on-error: true   # advisory in PR 1; enforced once the tree is clean

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Template doctests
        run: python -m doctest templates/unit_conversions.py -v | tail -1

      - name: Template smoke tests
        run: python scripts/run_template_smoke_tests.py

      - name: Summary
        if: always()
        run: |
          {
            echo "## Templates (Python ${{ matrix.python-version }})"
            echo ""
            echo '```'
            python scripts/run_template_smoke_tests.py --quick 2>&1 | tail -25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
