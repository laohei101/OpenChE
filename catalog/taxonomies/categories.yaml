# Controlled category vocabulary.
#
# Categories are the second level of navigation, under `domains`. Adding one is
# a deliberate act: an unbounded category list is the same as no category list,
# because nothing groups. Propose new categories in a pull request that also
# assigns at least two existing records to them.
#
# Validated by scripts/validate_catalog.py.

