# Checks every link in the list for rot, weekly and on any change to the README.
#
# Link rot is the failure mode that quietly kills a curated list: a project moves,
# a university page disappears, a domain lapses and gets re-registered by someone
# else. Catching it automatically is the difference between a list people trust
# and one they stop opening.
name: Link check

on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]
  schedule:
    # Mondays at 07:00 UTC. Weekly is often enough for link rot and rare enough
    # that a flaky publisher site doesn't generate daily noise.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          # --max-concurrency keeps us from looking like a scraper to smaller
          # academic hosts, several of which will otherwise rate-limit and
          # produce failures that have nothing to do with link rot.
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200,203,206,301,302,307,308,429
            --exclude-mail
            --exclude-path .github
            './**/*.md'
          fail: false
          output: lychee-report.md

      - name: Publish report to the job summary
        if: always()
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true

      # On the scheduled run only, open (or update) one tracking issue. On PRs
      # the summary is enough -- nobody wants an issue per pull request.
      - name: Open a tracking issue for broken links
        if: >-
          github.event_name == 'schedule' &&
          steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Broken links found in the weekly check"
          content-filepath: lychee-report.md
          labels: broken-link, good first issue

      # A 429 or a publisher blocking automated requests is not link rot.
      # Failing the PR on those would train everyone to ignore the check, so
      # the status is informational on pull requests and only the scheduled
      # run raises an issue.
      - name: Note the outcome
        if: always()
        run: |
          if [ "${{ steps.lychee.outputs.exit_code }}" = "0" ]; then
            echo "All links resolved."
          else
            echo "::warning::Some links did not resolve. Check the summary above."
            echo "Sites that block automated requests show up here too -- verify by hand"
            echo "before removing an entry."
          fi
